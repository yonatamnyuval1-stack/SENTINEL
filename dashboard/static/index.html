<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SENTINEL</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="side-title">SENTINEL</div>
      <nav class="side-nav">
        <button type="button" class="nav-item is-on" data-view="logs">Logs</button>
        <button type="button" class="nav-item" data-view="heartbeats">Heartbeats</button>
      </nav>
    </aside>
    <section class="main">
      <div class="main-bar">
        <h1 id="view-title">Logs</h1>
        <span id="status-line">loading…</span>
      </div>

      <table class="log-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Kind</th>
            <th>Massage</th>
            <th>Detail</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr>
            <td colspan="4" class="empty">No rows yet.</td>
          </tr>
        </tbody>
     </table>
     </section>        

  </div>
  <script src="/app.js"></script>
</body>
</html>
